<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayDrone · WASM</title>
    <style>
        :root { --bg:#0c0809; --panel:#170f12; --accent:#ff355e; --accent-dim:#b3132f; --text:#f0e2e6; }
        * { box-sizing: border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',Tahoma,sans-serif;
               display:flex; justify-content:center; padding:28px 16px; margin:0; min-height:100vh; }
        .container { background:var(--panel); padding:28px; border-radius:18px; width:min(560px,100%);
                     border:1px solid rgba(255,53,94,0.12); box-shadow:0 20px 50px rgba(255,53,94,0.05); }
        h1 { font-size:1.5rem; text-align:center; margin:0; letter-spacing:2px; text-transform:uppercase;
             color:var(--accent); text-shadow:0 0 10px rgba(255,53,94,0.3); }
        .sub { text-align:center; color:#8a99ad; font-size:0.82rem; margin:6px 0 22px; }
        .badge { display:block; text-align:center; font-family:monospace; font-size:0.66rem; letter-spacing:2px;
                 color:var(--accent-dim); text-transform:uppercase; margin-bottom:18px; }
        .file-label { display:block; text-align:center; background:rgba(255,53,94,0.1); border:1px dashed var(--accent);
                      padding:12px; border-radius:8px; cursor:pointer; color:var(--accent); font-weight:600; }
        input[type="file"] { display:none; }
        canvas { display:block; width:100%; height:90px; background:#07080e; border-radius:8px;
                 border:1px solid rgba(255,53,94,0.12); margin:16px 0; cursor:crosshair; }
        .presets { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
        .preset { padding:11px 8px; border:1px solid rgba(255,53,94,0.18); border-radius:8px; background:#0f1320;
                  color:#cfe; font-family:monospace; font-size:0.8rem; cursor:pointer; transition:all .2s; }
        .preset:hover { background:rgba(255,53,94,0.14); }
        .preset.active { background:rgba(255,53,94,0.22); border-color:var(--accent); color:var(--accent); }
        .ctl { margin-bottom:16px; }
        .ctl label { display:flex; justify-content:space-between; font-size:0.8rem; text-transform:uppercase;
                     letter-spacing:1px; color:#8a99ad; margin-bottom:8px; }
        .ctl label .v { color:var(--accent); font-family:monospace; }
        input[type="range"] { -webkit-appearance:none; appearance:none; width:100%; height:6px; background:#23273a;
                              border-radius:3px; outline:none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
                              background:var(--accent); cursor:pointer; box-shadow:0 0 10px var(--accent); }
        .btn { width:100%; border:none; padding:15px; border-radius:10px; font-size:1rem; font-weight:bold;
               text-transform:uppercase; letter-spacing:1px; cursor:pointer; transition:all .25s; }
        .btn-play { background:linear-gradient(135deg,var(--accent-dim),var(--accent)); color:#050608; margin-top:6px; }
        .btn-play:disabled { background:#23273a; color:#555c77; cursor:not-allowed; }
        .status { text-align:center; font-family:monospace; font-size:0.76rem; color:#c6d2e5; margin-top:16px; min-height:1em; }
        #meter { height:6px; background:#23273a; border-radius:3px; overflow:hidden; margin:-6px 0 14px; }
        #meter-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent-dim),var(--accent),#ffb3c1);
                      transition:width .08s linear; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RayDrone</h1>
        <p class="sub">Drones y texturas a partir de tus samples</p>
        <span class="badge">Rust · WebAssembly · AudioWorklet</span>

        <label class="file-label" id="file-label" for="file">📁 Cargar WAV / MP3</label>
        <input type="file" id="file" accept="audio/*">

        <canvas id="wave" width="700" height="90"></canvas>
        <div id="meter"><div id="meter-fill"></div></div>

        <div class="presets">
            <button class="preset" data-mode="dry" data-t="0.3" data-aber="0" data-tail="0" data-evo="0" data-width="0" data-oct="0" data-reverb="0">Original (Dry)</button>
            <button class="preset active" data-mode="drone" data-t="0.35" data-aber="0" data-tail="0" data-evo="0" data-width="35" data-oct="0" data-reverb="15">Drone</button>
            <button class="preset" data-mode="shimmer" data-t="0.6" data-aber="18" data-tail="0" data-evo="12" data-width="60" data-oct="50" data-reverb="45">Shimmer</button>
        </div>

        <div class="ctl">
            <label>Carácter (Tonal → Drone) <span class="v" id="char-v">—</span></label>
            <input type="range" id="char" min="0" max="100" value="35">
        </div>

        <div class="ctl">
            <label>Volumen <span class="v" id="vol-v">80 %</span></label>
            <input type="range" id="vol" min="0" max="100" value="80">
        </div>

        <div class="ctl">
            <label>Aberración (graves anchos / agudos finos) <span class="v" id="aber-v">0 %</span></label>
            <input type="range" id="aber" min="0" max="100" value="0">
        </div>

        <div class="ctl">
            <label>Cola / Rebotes <span class="v" id="tail-v">0 %</span></label>
            <input type="range" id="tail" min="0" max="100" value="0">
        </div>

        <div class="ctl">
            <label>Autoevolución (recursiva) <span class="v" id="evo-v">0 %</span></label>
            <input type="range" id="evo" min="0" max="100" value="0">
        </div>

        <div class="ctl">
            <label>Estéreo (Width) <span class="v" id="width-v">0 %</span></label>
            <input type="range" id="width" min="0" max="100" value="0">
        </div>

        <div class="ctl">
            <label>Octava / Shimmer <span class="v" id="oct-v">0 %</span></label>
            <input type="range" id="oct" min="0" max="100" value="0">
        </div>

        <div class="ctl">
            <label>Pitch (transposición) <span class="v" id="pitch-v">0 st</span></label>
            <input type="range" id="pitch" min="-12" max="12" value="0" step="1">
        </div>

        <div class="ctl">
            <label>Reverb (espacio) <span class="v" id="reverb-v">0 %</span></label>
            <input type="range" id="reverb" min="0" max="100" value="0">
        </div>

        <div class="ctl" style="display:flex; justify-content:space-between; align-items:center;">
            <label style="margin:0;">Muestreo suave (QMC) <span class="v" id="smooth-v">ON</span></label>
            <input type="checkbox" id="smooth" checked style="width:20px; height:20px; accent-color:#ff355e; cursor:pointer;">
        </div>

        <div class="ctl" style="display:flex; justify-content:space-between; align-items:center;">
            <label style="margin:0;">Rayos inteligentes (trazado inverso) <span class="v" id="smart-v">OFF</span></label>
            <input type="checkbox" id="smart" style="width:20px; height:20px; accent-color:#ff355e; cursor:pointer;">
        </div>

        <button class="btn btn-play" id="play" disabled>Esperando audio…</button>
        <div class="status" id="status">Carga un WAV o MP3 para empezar.</div>

        <div id="lab" style="margin-top:20px; border-top:1px solid rgba(255,53,94,0.15); padding-top:16px;">
            <div style="font-family:monospace; font-size:0.72rem; letter-spacing:2px; text-transform:uppercase; color:var(--accent-dim); margin-bottom:4px;">⚗ Convergence Lab</div>
            <div class="sub" style="margin:0 0 10px; text-align:left;">Prueba empírica: el render converge al objetivo con error ~ 1/√N</div>
            <canvas id="lab-canvas" width="700" height="240" style="height:240px; cursor:default;"></canvas>
            <button class="btn btn-play" id="lab-run" style="margin-top:8px;">▶ Correr test de convergencia</button>
            <div id="lab-readout" class="status" style="text-align:left; line-height:1.5;">Carga un audio y corre el test.</div>
            <div class="presets" style="grid-template-columns:repeat(4,1fr); margin-top:10px;">
                <button class="preset" id="lab-target" disabled>Objetivo</button>
                <button class="preset" id="lab-noisy" disabled>N=4</button>
                <button class="preset" id="lab-clean" disabled>N=256</button>
                <button class="preset" id="lab-stop" disabled>■ Stop</button>
            </div>
        </div>
    </div>

    <script>
    const $ = (id) => document.getElementById(id);
    const fileInput = $('file'), fileLabel = $('file-label'), playBtn = $('play'), statusEl = $('status');
    const charSlider = $('char'), charV = $('char-v'), volSlider = $('vol'), volV = $('vol-v');
    const smoothChk = $('smooth'), smoothV = $('smooth-v');
    const aberSlider = $('aber'), aberV = $('aber-v');
    const tailSlider = $('tail'), tailV = $('tail-v');
    const evoSlider = $('evo'), evoV = $('evo-v');
    const widthSlider = $('width'), widthV = $('width-v');
    const octSlider = $('oct'), octV = $('oct-v');
    const pitchSlider = $('pitch'), pitchV = $('pitch-v');
    const reverbSlider = $('reverb'), reverbV = $('reverb-v');
    const smartChk = $('smart'), smartV = $('smart-v');
    const meterFill = $('meter-fill');
    const presets = Array.from(document.querySelectorAll('.preset'));
    const waveCanvas = $('wave'), wctx = waveCanvas.getContext('2d');

    let ctx = null, jsGain = null, node = null, wasmModule = null;
    let sampleData = null, sampleRate = 44100, duration = 0;
    let focusSec = 0, mode = 'drone', isPlaying = false, drySource = null;
    let wavePeaks = null;   // pico por pixel (precalculado al cargar)
    let visRays = [];       // rayos a dibujar (posiciones de granos reales)

    // ── Mapeo del knob Carácter → parámetros del motor ──────────────────────
    function paramsFromChar() {
        const t = clamp(parseFloat(charSlider.value) / 100, 0, 1);
        const aperture = 0.02 + t * t * 0.6;          // 20 ms .. 620 ms
        const grainMs  = 80 + t * 120;                 // 80 .. 200 ms
        const grainRate = 140 + t * 260;               // 140 .. 400 granos/s
        const concurrency = Math.max(1, grainRate * grainMs / 1000);
        // Nivel pleno (como el drone por defecto, que suena lleno) pero escalando con la
        // densidad. El soft-clip del motor le da cuerpo sin distorsionar en exceso.
        const gain = clamp(1.5 / Math.sqrt(concurrency), 0, 0.5);
        return { focus: focusSec, aperture, grainMs, grainRate, gain, master: 1.0 };
    }
    const clamp = (x, a, b) => Math.min(Math.max(x, a), b);

    function sendParams(active) {
        if (!node) return;
        const p = paramsFromChar();
        if (!active) p.grainRate = 0; // motor en silencio (las voces se apagan solas)
        node.port.postMessage({ type: 'params', ...p });
    }

    function sendFx() {
        if (!node) return;
        const aber = parseFloat(aberSlider.value) / 100;
        const tail = parseFloat(tailSlider.value) / 100;
        const bounces = Math.round(tail * 4);        // 0..4 rebotes
        const refl = 0.35 + tail * 0.5;              // 0.35..0.85 supervivencia
        const feedback = parseFloat(evoSlider.value) / 100;
        node.port.postMessage({ type: 'fx', aber, bounces, refl, feedback });
    }

    function sendSpace() {
        if (!node) return;
        node.port.postMessage({
            type: 'space',
            width: parseFloat(widthSlider.value) / 100,
            oct: parseFloat(octSlider.value) / 100,
        });
    }

    function sendPitch() {
        if (!node) return;
        const semis = parseFloat(pitchSlider.value);
        node.port.postMessage({ type: 'pitch', mult: Math.pow(2, semis / 12) });
    }

    function sendReverb() {
        if (!node) return;
        node.port.postMessage({ type: 'reverb', wet: parseFloat(reverbSlider.value) / 100 });
    }

    function sendSmart() {
        if (!node) return;
        node.port.postMessage({ type: 'smart', on: smartChk.checked ? 1 : 0 });
    }

    function charWord() {
        const t = parseFloat(charSlider.value) / 100;
        return t < 0.34 ? 'Tonal' : t < 0.67 ? 'Textura' : 'Drone';
    }

    // ── Motor (lazy): AudioContext + worklet + módulo wasm ──────────────────
    async function ensureEngine() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            jsGain = ctx.createGain();
            jsGain.gain.value = parseFloat(volSlider.value) / 100;
            jsGain.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') await ctx.resume();
        if (!wasmModule) {
            const bytes = await fetch('raydrone.wasm').then(r => r.arrayBuffer());
            wasmModule = await WebAssembly.compile(bytes);
            await ctx.audioWorklet.addModule('processor.js');
        }
        if (!node) {
            node = new AudioWorkletNode(ctx, 'raydrone', {
                numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
                processorOptions: { module: wasmModule },
            });
            node.connect(jsGain);
            node.port.onmessage = (e) => {       // rayos + nivel desde el worklet
                const d = e.data;
                if (d.type === 'rays') { pushRays(d.offsets, d.bands); setMeter(d.level); }
                else if (d.type === 'level') setMeter(d.level);
            };
            // LUT de ventana Hann (JS sí tiene Math.cos)
            const win = new Float32Array(2048);
            for (let i = 0; i < 2048; i++) win[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / 2047));
            node.port.postMessage({ type: 'window', data: win });
            node.port.postMessage({ type: 'mode', value: smoothChk.checked ? 1 : 0 });
            sendFx();
            sendSpace();
            sendPitch();
            sendReverb();
            sendSmart();
        }
        if (sampleData) {
            node.port.postMessage({ type: 'sample', data: sampleData, sampleRate });
        }
    }

    // ── Carga de audio ──────────────────────────────────────────────────────
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileLabel.innerText = `✔ ${file.name.substring(0, 26)}`;
        statusEl.innerText = 'Decodificando…';
        try {
            await ensureEngine();
            const buf = await ctx.decodeAudioData(await file.arrayBuffer());
            sampleData = buf.getChannelData(0).slice(); // copia del canal 0
            sampleRate = buf.sampleRate;
            duration = buf.duration;
            focusSec = duration * 0.3;
            node.port.postMessage({ type: 'sample', data: sampleData, sampleRate });
            sendParams(false); // silencio hasta que se pulse Play (el motor arranca con rate=0)
            computePeaks();
            playBtn.disabled = false;
            playBtn.innerText = '▶ Play';
            statusEl.innerText = `Audio listo · ${duration.toFixed(2)} s · click en la onda para mover el foco`;
        } catch (err) {
            statusEl.innerText = 'Error al decodificar el audio.';
            console.error(err);
        }
    });

    // ── Transporte ──────────────────────────────────────────────────────────
    function stopDry() {
        if (drySource) { try { drySource.stop(); } catch (_) {} drySource = null; }
    }
    function startDry() {
        stopDry();
        const buf = ctx.createBuffer(1, sampleData.length, sampleRate);
        buf.copyToChannel(sampleData, 0);
        const s = ctx.createBufferSource();
        s.buffer = buf; s.loop = true;
        s.connect(jsGain);
        s.start(ctx.currentTime, focusSec);
        drySource = s;
    }
    function stopAll() { stopDry(); sendParams(false); }

    async function play() {
        await ensureEngine();
        isPlaying = true;
        playBtn.innerText = '⏸ Pause';
        if (mode === 'dry') startDry();
        else sendParams(true);
    }
    function stop() {
        isPlaying = false;
        playBtn.innerText = '▶ Play';
        stopAll();
    }

    playBtn.addEventListener('click', () => { isPlaying ? stop() : play(); });

    presets.forEach((btn) => {
        btn.addEventListener('click', () => {
            presets.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            mode = btn.dataset.mode;
            if (btn.dataset.t !== undefined) {
                charSlider.value = Math.round(parseFloat(btn.dataset.t) * 100);
                charV.innerText = charWord();
            }
            if (btn.dataset.aber !== undefined) {
                aberSlider.value = btn.dataset.aber; aberV.innerText = `${btn.dataset.aber} %`;
                tailSlider.value = btn.dataset.tail; tailV.innerText = `${btn.dataset.tail} %`;
                evoSlider.value = btn.dataset.evo;   evoV.innerText = `${btn.dataset.evo} %`;
                widthSlider.value = btn.dataset.width; widthV.innerText = `${btn.dataset.width} %`;
                octSlider.value = btn.dataset.oct;     octV.innerText = `${btn.dataset.oct} %`;
                reverbSlider.value = btn.dataset.reverb; reverbV.innerText = `${btn.dataset.reverb} %`;
            }
            sendFx();
            sendSpace();
            sendReverb();
            if (isPlaying) {            // aplicar el cambio al vuelo
                stopAll();
                if (mode === 'dry') startDry(); else sendParams(true);
            }
        });
    });

    charSlider.addEventListener('input', () => {
        charV.innerText = charWord();
        if (mode === 'dry') {           // tocar el carácter = quieres el motor
            mode = 'drone';
            presets.forEach(b => b.classList.toggle('active', b.dataset.mode === 'drone'));
            if (isPlaying) { stopDry(); sendParams(true); }
        } else if (isPlaying) {
            sendParams(true);
        }
    });

    volSlider.addEventListener('input', () => {
        volV.innerText = `${volSlider.value} %`;
        if (jsGain) jsGain.gain.value = parseFloat(volSlider.value) / 100;
    });

    smoothChk.addEventListener('change', () => {
        smoothV.innerText = smoothChk.checked ? 'ON' : 'OFF';
        if (node) node.port.postMessage({ type: 'mode', value: smoothChk.checked ? 1 : 0 });
    });

    [aberSlider, tailSlider, evoSlider].forEach((sl) => {
        sl.addEventListener('input', () => {
            aberV.innerText = `${aberSlider.value} %`;
            tailV.innerText = `${tailSlider.value} %`;
            evoV.innerText = `${evoSlider.value} %`;
            sendFx();
        });
    });

    [widthSlider, octSlider].forEach((sl) => {
        sl.addEventListener('input', () => {
            widthV.innerText = `${widthSlider.value} %`;
            octV.innerText = `${octSlider.value} %`;
            sendSpace();
        });
    });

    pitchSlider.addEventListener('input', () => {
        const s = parseInt(pitchSlider.value, 10);
        pitchV.innerText = `${s > 0 ? '+' : ''}${s} st`;
        sendPitch();
    });

    reverbSlider.addEventListener('input', () => {
        reverbV.innerText = `${reverbSlider.value} %`;
        sendReverb();
    });

    smartChk.addEventListener('change', () => {
        smartV.innerText = smartChk.checked ? 'ON' : 'OFF';
        sendSmart();
    });

    let meterTarget = 0;
    function setMeter(level) {
        // level ~ envolvente media; mapear a % con un poco de ganancia visual
        meterTarget = Math.min(100, level * 180);
    }

    // ── Visualización: onda + rayos (granos reales) + foco ──────────────────
    function computePeaks() {
        const W = waveCanvas.width;
        wavePeaks = new Float32Array(W);
        if (!sampleData) return;
        for (let x = 0; x < W; x++) {
            const start = Math.floor(x / W * sampleData.length);
            const end = Math.floor((x + 1) / W * sampleData.length);
            let peak = 0;
            for (let i = start; i < end; i++) { const v = Math.abs(sampleData[i]); if (v > peak) peak = v; }
            wavePeaks[x] = peak;
        }
    }

    function pushRays(offsets, bands) {
        const inv = 1 / Math.max(duration, 0.001);
        for (let k = 0; k < offsets.length; k++) {
            visRays.push({ x: offsets[k] * inv, band: bands ? (bands[k] | 0) : 1, life: 1.0 });
        }
        if (visRays.length > 800) visRays.splice(0, visRays.length - 800);
    }

    // Color por banda: grave=naranja, medio=rojo, agudo=rosa claro (se ve la aberración)
    const BAND_RGB = [[255, 138, 61], [255, 53, 94], [255, 190, 215]];

    let meterShown = 0;
    function frame() {
        const W = waveCanvas.width, H = waveCanvas.height, mid = H / 2;
        wctx.clearRect(0, 0, W, H);
        wctx.fillStyle = '#07080e'; wctx.fillRect(0, 0, W, H);

        const dur = Math.max(duration, 0.001);
        const focusX = (focusSec / dur) * W;
        const glow = 0.4 + Math.min(1, meterShown / 70) * 0.6; // los visuales pulsan con el nivel

        // Cono de dispersión (apertura): zona alrededor del foco de la que salen los rayos
        if (sampleData) {
            const t = clamp(parseFloat(charSlider.value) / 100, 0, 1);
            const apSec = 0.02 + t * t * 0.6;
            const apX = (apSec / dur) * W;
            const grad = wctx.createLinearGradient(focusX - apX, 0, focusX + apX, 0);
            grad.addColorStop(0, 'rgba(255,53,94,0)');
            grad.addColorStop(0.5, 'rgba(255,53,94,0.10)');
            grad.addColorStop(1, 'rgba(255,53,94,0)');
            wctx.fillStyle = grad;
            wctx.fillRect(focusX - apX, 0, apX * 2, H);
        }

        // Onda original
        if (wavePeaks) {
            wctx.strokeStyle = 'rgba(255,53,94,0.26)'; wctx.beginPath();
            for (let x = 0; x < W; x++) {
                const a = wavePeaks[x] * (H * 0.45);
                wctx.moveTo(x, mid - a); wctx.lineTo(x, mid + a);
            }
            wctx.stroke();
        }

        // Rayos: cada grano nace en su offset y converge al foco mientras se desvanece
        wctx.lineWidth = 0.8;
        for (let i = visRays.length - 1; i >= 0; i--) {
            const r = visRays[i];
            r.life -= 0.03;
            if (r.life <= 0) { visRays.splice(i, 1); continue; }
            const jit = (Math.random() - 0.5) * H * 0.55 * (1 - r.life);
            const c = BAND_RGB[r.band] || BAND_RGB[1];
            wctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${r.life * 0.5 * glow})`;
            wctx.beginPath();
            wctx.moveTo(r.x * W, mid + jit);
            wctx.lineTo(focusX, mid);
            wctx.stroke();
        }
        wctx.lineWidth = 1;

        // Línea de foco (glow que pulsa con el nivel de salida)
        wctx.save();
        wctx.shadowColor = '#ff355e'; wctx.shadowBlur = 6 + glow * 16;
        wctx.strokeStyle = 'rgba(255,53,94,0.95)'; wctx.lineWidth = 2;
        wctx.beginPath(); wctx.moveTo(focusX, 0); wctx.lineTo(focusX, H); wctx.stroke();
        wctx.restore();

        // Medidor de salida (suavizado)
        meterShown += (meterTarget - meterShown) * 0.25;
        meterFill.style.width = `${meterShown}%`;

        requestAnimationFrame(frame);
    }

    waveCanvas.addEventListener('click', (e) => {
        if (!sampleData) return;
        const rect = waveCanvas.getBoundingClientRect();
        focusSec = clamp((e.clientX - rect.left) / rect.width * duration, 0, duration);
        if (isPlaying) { if (mode === 'dry') startDry(); else sendParams(true); }
    });

    // ════════════════════════════════════════════════════════════════════════
    //  CONVERGENCE LAB (experimento Monte Carlo sobre el sample, indep. del motor)
    // ════════════════════════════════════════════════════════════════════════
    const LAB_GRAIN = 4096;
    const LAB_MAX_A = 6600;                 // apertura máx. para el target exacto (rápido)
    const LAB_NS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096];
    const LAB_TRIALS = 4;
    const LAB_GOLDEN = 0.6180339887498949;
    const labFract = (x) => x - Math.floor(x);
    const LAB_SERIES = [
        { k: 'random', c: '#ff6b6b', label: 'Random' },
        { k: 'stratified', c: '#00ffcc', label: 'Stratified' },
        { k: 'qmc', c: '#7aa2ff', label: 'Quasi-MC' },
        { k: 'importance', c: '#ffe066', label: 'Importance' },
    ];
    let labHann = null, labCurves = null, labTarget = null, labA = 0, labF0 = 0, labAudio = null;

    const labCanvas = $('lab-canvas'), labCtx = labCanvas.getContext('2d');
    const labRun = $('lab-run'), labReadout = $('lab-readout');
    const labTargetBtn = $('lab-target'), labNoisyBtn = $('lab-noisy'), labCleanBtn = $('lab-clean'), labStopBtn = $('lab-stop');

    function labGetHann() {
        if (labHann) return labHann;
        labHann = new Float32Array(LAB_GRAIN);
        for (let n = 0; n < LAB_GRAIN; n++) labHann[n] = 0.5 * (1 - Math.cos(2 * Math.PI * n / (LAB_GRAIN - 1)));
        return labHann;
    }
    const labS = (i) => (sampleData && i >= 0 && i < sampleData.length) ? sampleData[i] : 0;
    const labTri = (u) => u < 0.5 ? -1 + Math.sqrt(2 * u) : 1 - Math.sqrt(2 * (1 - u));
    function labU(method, i, N, rot) {
        if (method === 'stratified') return (i + Math.random()) / N;
        if (method === 'qmc') return labFract(rot + i * LAB_GOLDEN);
        return Math.random();
    }

    // Objetivo determinista: target[n] = w[n] · Σ p(k)·s(f0+k+n)
    function labComputeTarget(f0, A) {
        const D = LAB_GRAIN, w = labGetHann(), out = new Float32Array(D), invA2 = 1 / (A * A);
        for (let k = -A; k <= A; k++) {
            const pk = (A - Math.abs(k)) * invA2;
            if (pk <= 0) continue;
            const b = f0 + k;
            for (let n = 0; n < D; n++) out[n] += pk * labS(b + n);
        }
        for (let n = 0; n < D; n++) out[n] *= w[n];
        return out;
    }
    function labImpSearch(cum, r) { let lo = 0, hi = cum.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < r) lo = m + 1; else hi = m; } return lo; }
    function labBuildImp(f0, A) {
        const len = 2 * A + 1, stride = 8, taps = Math.ceil(LAB_GRAIN / stride);
        const pm = new Float32Array(len), qm = new Float32Array(len), cum = new Float32Array(len), invA2 = 1 / (A * A);
        let ps = 0, qs = 0;
        for (let idx = 0; idx < len; idx++) {
            const k = idx - A, p = (A - Math.abs(k)) * invA2;
            let s = 0; const b = f0 + k;
            for (let n = 0; n < LAB_GRAIN; n += stride) { const v = labS(b + n); s += v * v; }
            const e = Math.sqrt(s / taps) + 1e-6;
            pm[idx] = p; qm[idx] = p * e; ps += p; qs += p * e;
        }
        let acc = 0;
        for (let idx = 0; idx < len; idx++) { pm[idx] /= ps; qm[idx] = qs > 0 ? qm[idx] / qs : 1 / len; acc += qm[idx]; cum[idx] = acc; }
        return { pm, qm, cum };
    }
    function labEstimate(f0, A, N, method, imp) {
        const D = LAB_GRAIN, w = labGetHann(), out = new Float32Array(D), rot = Math.random();
        if (method === 'importance' && imp) {
            let ws = 0;
            for (let i = 0; i < N; i++) {
                const u = (i + Math.random()) / N, idx = labImpSearch(imp.cum, u), k = idx - A, wi = imp.pm[idx] / imp.qm[idx];
                ws += wi; const b = f0 + k;
                for (let n = 0; n < D; n++) out[n] += wi * labS(b + n);
            }
            const inv = ws > 0 ? 1 / ws : 0;
            for (let n = 0; n < D; n++) out[n] *= inv * w[n];
            return out;
        }
        for (let i = 0; i < N; i++) {
            const u = labU(method, i, N, rot), k = Math.round(labTri(u) * A), b = f0 + k;
            for (let n = 0; n < D; n++) out[n] += labS(b + n);
        }
        const inv = 1 / N;
        for (let n = 0; n < D; n++) out[n] *= inv * w[n];
        return out;
    }
    function labRms(a, t) { let s = 0; for (let n = 0; n < LAB_GRAIN; n++) { const d = a[n] - t[n]; s += d * d; } return Math.sqrt(s / LAB_GRAIN); }
    function labFitSlope(Ns, ys) {
        let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
        for (let i = 0; i < Ns.length; i++) { if (ys[i] <= 0) continue; const x = Math.log10(Ns[i]), y = Math.log10(ys[i]); n++; sx += x; sy += y; sxx += x * x; sxy += x * y; }
        return n < 2 ? NaN : (n * sxy - sx * sy) / (n * sxx - sx * sx);
    }

    function labRunTest() {
        if (!sampleData) { labReadout.innerText = 'Carga un audio primero.'; return; }
        labRun.disabled = true; labReadout.innerText = 'Calculando convergencia…';
        setTimeout(() => {
            const t = clamp(parseFloat(charSlider.value) / 100, 0, 1);
            const apSec = 0.02 + t * t * 0.6;
            const A = Math.max(1, Math.min(LAB_MAX_A, Math.round(apSec * sampleRate)));
            const f0 = Math.round(clamp(focusSec, 0, duration) * sampleRate);
            const target = labComputeTarget(f0, A);
            const imp = labBuildImp(f0, A);
            const curves = {};
            for (const s of LAB_SERIES) {
                curves[s.k] = LAB_NS.map((N) => {
                    let acc = 0;
                    for (let tr = 0; tr < LAB_TRIALS; tr++) acc += labRms(labEstimate(f0, A, N, s.k, imp), target);
                    return acc / LAB_TRIALS;
                });
            }
            labTarget = target; labA = A; labF0 = f0; labCurves = { Ns: LAB_NS, ...curves };
            labDrawPlot(); labUpdateReadout();
            labRun.disabled = false;
            [labTargetBtn, labNoisyBtn, labCleanBtn, labStopBtn].forEach((b) => b.disabled = false);
        }, 20);
    }

    function labUpdateReadout() {
        const Ns = labCurves.Ns, last = Ns.length - 1, f = (v) => v.toExponential(2);
        let html = `<pre style="margin:0;white-space:pre-wrap;font-size:0.72rem;color:#c6d2e5;">`;
        html += `apertura ${(labA / sampleRate * 1000).toFixed(0)} ms · grano ${LAB_GRAIN} · N→${Ns[last]} · ${LAB_TRIALS} tiradas\n`;
        html += `método        exponente   RMS@${Ns[last]}\n`;
        for (const s of LAB_SERIES) {
            const sl = labFitSlope(Ns, labCurves[s.k]);
            html += `<span style="color:${s.c}">${s.label.padEnd(12)} ${sl.toFixed(3).padStart(7)}   ${f(labCurves[s.k][last])}</span>\n`;
        }
        html += `<span style="color:#8a99ad">(ideal random ≈ −0.50; los demás bajan más)</span></pre>`;
        labReadout.innerHTML = html;
    }

    function labDrawPlot() {
        const W = labCanvas.width, H = labCanvas.height, padL = 52, padR = 10, padT = 12, padB = 26;
        labCtx.clearRect(0, 0, W, H);
        labCtx.fillStyle = '#07080e'; labCtx.fillRect(0, 0, W, H);
        if (!labCurves) {
            labCtx.fillStyle = 'rgba(255,255,255,0.3)'; labCtx.font = '12px monospace';
            labCtx.fillText('Corre el test para ver la curva de convergencia', padL, H / 2);
            return;
        }
        const Ns = labCurves.Ns;
        let ymin = Infinity, ymax = -Infinity;
        for (const s of LAB_SERIES) for (const v of labCurves[s.k]) if (v > 0) { const ly = Math.log10(v); if (ly < ymin) ymin = ly; if (ly > ymax) ymax = ly; }
        if (!isFinite(ymin)) { ymin = -4; ymax = 0; }
        ymin = Math.floor(ymin - 0.2); ymax = Math.ceil(ymax + 0.2);
        const xmax = Math.log2(Ns[Ns.length - 1]);
        const X = (N) => padL + Math.log2(N) / xmax * (W - padL - padR);
        const Y = (e) => padT + (ymax - Math.log10(e)) / (ymax - ymin) * (H - padT - padB);
        labCtx.font = '10px monospace';
        for (let d = ymin; d <= ymax; d++) {
            const y = Y(Math.pow(10, d));
            labCtx.strokeStyle = 'rgba(255,255,255,0.07)'; labCtx.beginPath(); labCtx.moveTo(padL, y); labCtx.lineTo(W - padR, y); labCtx.stroke();
            labCtx.fillStyle = 'rgba(255,255,255,0.45)'; labCtx.fillText(`1e${d}`, 6, y + 3);
        }
        for (const N of Ns) { const x = X(N); labCtx.fillStyle = 'rgba(255,255,255,0.4)'; labCtx.fillText(String(N), x - 6, H - padB + 14); }
        // ideal 1/√N
        const anchor = labCurves.random[0];
        if (anchor > 0) {
            labCtx.strokeStyle = 'rgba(255,255,255,0.35)'; labCtx.setLineDash([5, 4]); labCtx.beginPath();
            for (let i = 0; i < Ns.length; i++) { const e = anchor / Math.sqrt(Ns[i] / Ns[0]); const px = X(Ns[i]), py = Y(e); i === 0 ? labCtx.moveTo(px, py) : labCtx.lineTo(px, py); }
            labCtx.stroke(); labCtx.setLineDash([]);
        }
        for (const s of LAB_SERIES) {
            const data = labCurves[s.k]; labCtx.strokeStyle = s.c; labCtx.lineWidth = 1.8; labCtx.beginPath();
            let started = false;
            for (let i = 0; i < Ns.length; i++) { if (data[i] <= 0) continue; const px = X(Ns[i]), py = Y(data[i]); started ? labCtx.lineTo(px, py) : (labCtx.moveTo(px, py), started = true); }
            labCtx.stroke();
            labCtx.fillStyle = s.c;
            for (let i = 0; i < Ns.length; i++) { if (data[i] <= 0) continue; labCtx.beginPath(); labCtx.arc(X(Ns[i]), Y(data[i]), 2, 0, Math.PI * 2); labCtx.fill(); }
        }
        labCtx.lineWidth = 1;
        let lx = padL + 6; const ly = padT + 8;
        for (const s of LAB_SERIES) { labCtx.fillStyle = s.c; labCtx.fillRect(lx, ly - 7, 10, 3); labCtx.fillStyle = 'rgba(255,255,255,0.7)'; labCtx.fillText(s.label, lx + 13, ly); lx += 13 + labCtx.measureText(s.label).width + 14; }
    }

    function labStop() { if (labAudio) { try { labAudio.stop(); } catch (e) {} try { labAudio.disconnect(); } catch (e) {} labAudio = null; } }
    async function labPlay(kind) {
        if (!labTarget) return;
        await ensureEngine();
        if (ctx.state === 'suspended') await ctx.resume();
        labStop();
        let g;
        if (kind === 'target') g = labTarget;
        else if (kind === 'noisy') g = labEstimate(labF0, labA, 4, 'random', null);
        else g = labEstimate(labF0, labA, 256, 'random', null);
        let peak = 1e-6;
        for (let n = 0; n < labTarget.length; n++) peak = Math.max(peak, Math.abs(labTarget[n]));
        const norm = 0.7 / peak;
        const buf = ctx.createBuffer(1, g.length, sampleRate);
        const ch = buf.getChannelData(0);
        for (let n = 0; n < g.length; n++) ch[n] = g[n] * norm;
        const s = ctx.createBufferSource();
        s.buffer = buf; s.loop = true; s.connect(jsGain); s.start();
        labAudio = s;
    }

    labRun.addEventListener('click', labRunTest);
    labTargetBtn.addEventListener('click', () => labPlay('target'));
    labNoisyBtn.addEventListener('click', () => labPlay('noisy'));
    labCleanBtn.addEventListener('click', () => labPlay('clean'));
    labStopBtn.addEventListener('click', labStop);
    labDrawPlot();

    charV.innerText = charWord();
    requestAnimationFrame(frame);
    </script>
</body>
</html>
